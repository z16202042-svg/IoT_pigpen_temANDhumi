// manual activation button
window.manualCooling = function() {

    console.log("Manual activation started!");

    const fanRef =
        ref(database, "/devices/fan/status");

    const pumpRef =
        ref(database, "/devices/water_pump/status");

    const masterRef =
        ref(database, "/devices/master_switch/status");


    get(masterRef)
    .then((masterSnapshot) => {

        const masterStatus =
            masterSnapshot.val();

        console.log(
            "Master switch status: ",
            masterStatus
        );


        if (masterStatus !== "ON") {

            console.log(
                "Manual activation is blocked!"
            );

            alert("Master switch is OFF");

            return;
        }


        return get(fanRef)

        .then((snapshot) => {

            let currentStatus =
                snapshot.val();

            console.log(
                "Current fan status: ",
                currentStatus
            );


            if (currentStatus === true) {

                currentStatus = "ON";
            }


            const newState =
                currentStatus === "ON"
                ? "OFF"
                : "ON";


            console.log(
                "New status: ",
                newState
            );


            return Promise.all([

                set(
                    fanRef,
                    newState
                ),

                set(
                    pumpRef,
                    newState
                )

            ])

            .then(() => {

                console.log(
                    "Fan status changed to: ",
                    newState
                );

                console.log(
                    "Water pump status changed to: ",
                    newState
                );


                if (newState === "ON") {

                    document.getElementById("fanStatus").innerHTML =
                        "<h4>Fan Status: ON</h4>";

                    document.getElementById("sprinklerStatus").innerHTML =
                        "<h4>Water Pump Status: ON</h4>";
                }

                else {

                    document.getElementById("fanStatus").innerHTML =
                        "<h4>Fan Status: OFF</h4>";

                    document.getElementById("sprinklerStatus").innerHTML =
                        "<h4>Water Pump Status: OFF</h4>";
                }

            });

        });

    })

    .catch((error) => {

        console.error(
            "Manual activation error:",
            error
        );

    });

};

// Activation history 


let activationRecord =[];
let currentFilter = "daily";

function saveActivation(temperature, humidity) {
const now = new Date();

const newRecord = push (
    ref(database,"activationHistory")
);

set(newRecord, {
    date: now.toLocaleDateString(),
    time: now.toLocaleTimeString(),
    temperature: temperature,
    humidity: humidity,
    timestamp:Date.now()
})
.then(() => {
    console.log("Activation save!");
    alert("activation is save to firebase!");
})
.catch((error) => {
    console.error("firebase save error:",error);
    alert("firebase: error" + error.message);
});
}

onValue(
    ref(database, "activationHistory"),
    (snapshot) => {
        activationRecord = [];
        if (snapshot.exists()){
            const date = snapshot.val();
            Object.keys(date).forEach(key => {
                activationRecord.push(date[key]);
            });
       }
       showRecord(currentFilter);
    }
    

);
window.showRecord = function(filter) {

    currentFilter = filter;

    const table =
        document.getElementById("activationTable");

    const title =
        document.getElementById("periodTitle");


    if (filter === "daily") {

        title.textContent =
            "Daily activation history";

    }
    else if (filter === "weekly") {

        title.textContent =
            "Weekly activation history";

    }
    else {

        title.textContent =
            "Monthly activation history";
    }


    table.innerHTML = "";

    const now = Date.now();

    const record = activationRecord.filter(record => {

        const age =
            (now - record.timestamp)
            / (1000 * 60 * 60 * 24);


        if (filter === "daily") {

            return age < 7;
        }


        if (filter === "weekly") {

            return age >= 7 && age < 30;
        }


        if (filter === "monthly") {

            return age >= 30;
        }

        return false;

    });


    if (record.length === 0) {

        table.innerHTML = `
            <tr>
                <td colspan="4" style="padding:15px;">
                    No activation record found.
                </td>
            </tr>
        `;

        return;
    }


    record.forEach(record => {

        table.innerHTML += `
            <tr>

                <td style="padding:10px;">
                    ${record.date}
                </td>

                <td style="padding:10px;">
                    ${record.time}
                </td>

                <td style="padding:10px;">
                    ${record.temperature}
                </td>

                <td style="padding:10px;">
                    ${record.humidity}
                </td>

            </tr>
        `;

    });

};

// Set Threshold

let temperatureThreshold = null;
let humidityThreshold = null;

window.showThreshold = function(){
document.getElementById("thresholdBox").style.display = "block";
};

window.saveThreshold = function(){
    const temp = Number(
        document.getElementById("tempThreshold").value);

        const humidity = Number(
        document.getElementById("humidityThreshold").value);
        
        console.log("temperature has been save", temp);
        console.log("humidity has been save", humidity);
        
    if (isNaN(temp) || isNaN(humidity)) {
        alert ("Pls enter the both temperature and humidity.");
        return;
    }

    console.log("Start Firebase sava...");

    set(
        ref(database, "settings/temperatureThreshold"),
        temp
    )
    .then(() => { 
        console.log("Temperature threshold saved!");

    })

    .catch((error) => {
        console.error (
            "temperature threshold error:",
            error
        );
    });

    set(
        ref(database,"settings/humidityThreshold"),
        humidity
    )
    .then(() => {
        console.log("Humidity threshold saved");
    })

    .catch(() => {
        console.error(
            "humidity threshold error:",
            error
        );
    });


    console.log("temperature threshold: ",temp);
    console.log("humidity threshold: ",humidity);

    alert("Threshold saved successfully!");

    document.getElementById("thresholdBox").style.display = "none";

};

// automatic cooling

let currentTemperature = null;
let currentHumidity = null;

let coolingActive = false;

onValue(

onValue(

        checkAutomaticCooling();

);

onValue(
    ref(database, "sensor/temperature"),
    (snapshot) => {
        currentTemperature = Number(snapshot.val());

        console.log(
        "Current temperature",
        currentTemperature
    );
    checkAutomaticCooling();
    }
);

onValue(
    ref(database, "sensor/humidity"),
    (snapshot) => {
        currentHumidity = Number(snapshot.val());

        console.log(
        "Current humidity",
        currentHumidity
    );
    checkAutomaticCooling();
    }
);

function checkAutomaticCooling() {

    console.log(
        "Automatic cooling activated!"
    );

    const masterRef =
    ref(database, "devices/master_switch/status");
    
    get(masterRef)
    .then((snapshot) => {
        const masterStatus = 
        snapshot.val();

        console.log("Master switch stauts: ", masterStatus);

        if(masterStatus !=="ON") {
            console.log(
                "Automatic cooling block master switch is OFF");
                return;
        }

        set(
            ref(database, "devices/water_pump/status"), "ON");

            set(
                ref(database,"devices/fan/status"), "ON" );
    
                saveActivation(
                    currentTemperature,
                    currentHumidity
                );
    })
    .catch((error) => {
        console.error(
            "Automatic cooling error: ", error
        );
    });
}  
  

// Mater switch to the fan and water pump status

onValue(
    ref(database,"devices/master_switch/status"),
    (snapshot) => {
        const switchStatus = snapshot.val();
        console.log("Master switch status", switchStatus);

        if (switchStatus === "ON") {

            document.getElementById("fanStatus").innerHTML =
            "<h4>Fan Status: ON</h4>";
             document.getElementById("sprinklerStatus").innerHTML =
            "<h4>Water Pump Status: ON</h4>";
        }
        else{
             document.getElementById("fanStatus").innerHTML =
            "<h4>Fan Status: OFF</h4>";

             document.getElementById("sprinklerStatus").innerHTML =
            "<h4>Water Pump Status: OFF</h4>";
        }
    }
);

// download activation history

window.download = function() {
    if (activationRecord.length === 0) {
        alert("no activation history available!");
        return;
    }
    let csv = 
    "Date,Time,Temperature,Humidity\n";

    activationRecord.forEach(record => {

        csv +=
            `"${record.date}",` +
            `"${record.time}",` +
            `"${record.temperature}",` +
            `"${record.humidity}"\n`;

    });

    const blob = new Blob (
        [csv],
        {
            type: "text/csv;charset=utf-8;"
        }
    );
    const url =
    URL.createObjectURL(blob);

    const link =
    document.createElement("a");

    link.setAttribute("href", url);

    link.setAttribute(
        "download",
        "activation_history.csv"
    );
    document.body.appendChild(link);
link.click();
    URL.revokeObjectURL(url);
};

    </script>
