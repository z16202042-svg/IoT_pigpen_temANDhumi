<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   
   <script type="module"> 

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import { getDatabase, ref, onValue }
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";


const firebaseConfig = {
    apiKey: "AIzaSyCRGbyb9E_lqImTlZAK7T-nk6HEUqLqBuA",
    authDomain: "my-esp32-project-3b1a5.firebaseapp.com",
    databaseURL: "https://my-esp32-project-3b1a5-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "my-esp32-project-3b1a5",
    storageBucket: "my-esp32-project-3b1a5.firebasestorage.app",
    messagingSenderId: "662857171235",
    appId: "1:662857171235:web:5d96d45284d34386188c96",
    measurementId: "G-7R4ZRNR40M"
};


const app = initializeApp(firebaseConfig);

const database = getDatabase(app);


// TEMPERATURE

const temperatureRef = ref(database, "sensor/temperature");

onValue(temperatureRef, (snapshot) => {

    const temperature = snapshot.val();

    console.log("Temperature:", temperature);

    document.getElementById("temperature").textContent =
        "Temperature: " + temperature + " °C";

});


// HUMIDITY

const humidityRef = ref(database, "sensor/humidity");

onValue(humidityRef, (snapshot) => {

    const humidity = snapshot.val();

    console.log("Humidity:", humidity);

    document.getElementById("humidity").textContent =
        "Humidity: " + humidity + " %";

});

    </script>

</head>
<body>
    <div style=" display: flex;
    flex-direction: row;
    gap: 40px;">
        <div style="background-color: azure; width: 250px;  height: 100px ;">
<h2 style="color: black; font-size: 30px; text-align: center;" id="temperature">  Temperature:</h2>
        </div>
        <div style="background-color: azure; width: 250px;  height: 100px ;">
<h2 style="color: black; font-size: 30px; text-align: center;" id="humidity">  
    Humidity:</h2>
        </div>
    </div>
</body>
</html>
